name: onetake-codeql-swift

# Runs marshiyar/oneTake's CodeQL Swift analysis on this organization's macOS runners and files the result in
# oneTake's code scanning, so the analysis no longer takes a macOS slot from oneTake's own pool.
#
# oneTake's codeql.yml (job swift-runners) sends a repository_dispatch `onetake-codeql-swift` for a push to main or a
# pull request from one of its own branches, and then skips its local swift job. This workflow:
#   start:   checks the payload and sets the commit status `codeql swift (runners-1)` on the oneTake commit to pending;
#   analyze: calls oneTake's codeql-swift-source.yml (its swift job, generated by .github/ci/source_workflows.py) on
#            that commit with no secrets and a read-only token; it never uploads, and leaves the SARIF file as the
#            artifact `sarif-swift`;
#   upload:  sends that file to oneTake's code scanning (POST /repos/marshiyar/oneTake/code-scanning/sarifs with
#            commit_sha, ref and the gzip+base64 SARIF; GitHub REST docs "Upload an analysis as SARIF data",
#            https://docs.github.com/en/rest/code-scanning/code-scanning#upload-an-analysis-as-sarif-data, read
#            2026-10-21) with the oneTake-Runners1 App token, and sets the status to the result.
#
# The App needs the repository permission "Code scanning alerts: Read and write" on marshiyar/oneTake for the upload
# (https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps, "Code scanning alerts",
# read 2026-10-21). Without it the token step fails and the job says which permission to add.

on:
  repository_dispatch:
    types: [onetake-codeql-swift]

permissions:
  contents: read

concurrency:
  group: onetake-codeql-swift-${{ github.event.client_payload.sha }}
  cancel-in-progress: false

env:
  SOURCE: marshiyar/oneTake
  CONTEXT: codeql swift (runners-1)

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      current: ${{ steps.current.outputs.current }}
      sha: ${{ steps.check.outputs.sha }}
      ref: ${{ steps.check.outputs.ref }}
      head: ${{ steps.check.outputs.head }}
    steps:
      - name: Check the payload
        id: check
        env:
          REPO: ${{ github.event.client_payload.repository }}
          SHA: ${{ github.event.client_payload.sha }}
          REF: ${{ github.event.client_payload.ref }}
          HEAD: ${{ github.event.client_payload.head }}
          RUN: ${{ github.event.client_payload.run }}
        run: |
          [ "$REPO" = "$SOURCE" ] || { echo "::error::payload repository '$REPO' is not $SOURCE"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::payload sha is not a full commit sha"; exit 1; }
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::payload head is not a full commit sha"; exit 1; }
          [[ "$REF" =~ ^refs/(heads/main|pull/[0-9]{1,7}/merge)$ ]] || { echo "::error::payload ref is not refs/heads/main or refs/pull/<n>/merge"; exit 1; }
          [[ "$RUN" =~ ^[0-9]{1,20}/[0-9]{1,4}$ ]] || { echo "::error::payload run is not <run id>/<attempt>"; exit 1; }
          { echo "sha=$SHA"; echo "ref=$REF"; echo "head=$HEAD"; } >> "$GITHUB_OUTPUT"
          echo "oneTake run $RUN: analyse $SHA for $REF" >> "$GITHUB_STEP_SUMMARY"
      - name: Still the newest commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ steps.check.outputs.head }}
        run: |
          # A commit that a newer push replaced is not built: oneTake's own run for it was cancelled by that push, so
          # nothing waits for this one. Replaced = it belongs to pull requests, is none of their open heads and is not
          # on main. Anything else, and any API failure, builds.
          current=true
          if prs=$(gh api "repos/$SOURCE/commits/$HEAD/pulls" --jq "[length, ([.[] | select(.state == \"open\" and .head.sha == \"$HEAD\")] | length)] | @tsv") &&
             onmain=$(gh api "repos/$SOURCE/compare/$HEAD...main" --jq .status); then
            read -r all open <<< "$prs"
            if [ "$all" -gt 0 ] && [ "$open" = 0 ] && [ "$onmain" != ahead ] && [ "$onmain" != identical ]; then current=false; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          [ "$current" = true ] || echo "$HEAD was replaced by a newer push: skipped" >> "$GITHUB_STEP_SUMMARY"
      - name: oneTake App token
        id: token
        if: steps.current.outputs.current == 'true'
        continue-on-error: true   # not installed on marshiyar/oneTake: the work still runs, without statuses
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: marshiyar
          repositories: oneTake
          permission-statuses: write
      - name: Status pending
        if: steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ steps.check.outputs.head }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/$SOURCE/statuses/$SHA" -f state=pending -f context="$CONTEXT" \
            -f description="analysing on OneTake-actionRunners-1" -f target_url="$RUN" > /dev/null

  analyze:
    needs: start
    if: needs.start.outputs.current == 'true'
    uses: marshiyar/oneTake/.github/workflows/codeql-swift-source.yml@main
    with:
      source_repository: marshiyar/oneTake
      source_ref: ${{ needs.start.outputs.sha }}

  upload:
    needs: [start, analyze]
    if: always() && needs.start.result == 'success' && needs.start.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: oneTake App token (statuses)
        id: token
        continue-on-error: true   # not installed on marshiyar/oneTake: the work still runs, without statuses
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: marshiyar
          repositories: oneTake
          permission-statuses: write
      - name: oneTake App token (code scanning)
        # A token of its own, so a missing permission still lets the status step below report the failure.
        id: scan
        if: needs.analyze.result == 'success'
        continue-on-error: true   # the next step names the missing permission and fails the job
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: marshiyar
          repositories: oneTake
          permission-security-events: write   # "Code scanning alerts: write", for POST .../code-scanning/sarifs
      - name: Which permission is missing
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::the oneTake-Runners1 App token for marshiyar/oneTake could not be made with security-events: write. Add the repository permission 'Code scanning alerts: Read and write' to the App (Settings > Developer settings > GitHub Apps > oneTake-Runners1 > Permissions), then accept the new permission on the marshiyar/oneTake installation."
          exit 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.analyze.result == 'success' && steps.scan.outcome == 'success'
        with:
          name: sarif-swift
          path: sarif
      - name: SARIF into oneTake's code scanning
        id: upload
        if: needs.analyze.result == 'success' && steps.scan.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.scan.outputs.token }}
          SHA: ${{ needs.start.outputs.sha }}
          REF: ${{ needs.start.outputs.ref }}
        run: |
          shopt -s nullglob
          files=(sarif/*.sarif)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::expected one SARIF file in the sarif-swift artifact, found ${#files[@]}"; exit 1; }
          gzip -c "${files[0]}" | base64 -w0 > "$RUNNER_TEMP/sarif.b64"
          jq -n --arg sha "$SHA" --arg ref "$REF" --rawfile sarif "$RUNNER_TEMP/sarif.b64" \
            '{commit_sha: $sha, ref: $ref, sarif: $sarif, tool_name: "CodeQL"}' > "$RUNNER_TEMP/body.json"
          if ! gh api -X POST "repos/$SOURCE/code-scanning/sarifs" --input "$RUNNER_TEMP/body.json" > "$RUNNER_TEMP/upload.json" 2> "$RUNNER_TEMP/err.txt"; then
            cat "$RUNNER_TEMP/err.txt"
            if grep -qE 'HTTP 403|Resource not accessible' "$RUNNER_TEMP/err.txt"; then
              echo "::error::code scanning refused the upload (403): give the oneTake-Runners1 App the repository permission 'Code scanning alerts: Read and write' and accept it on the marshiyar/oneTake installation"
            else
              echo "::error::the SARIF upload to $SOURCE failed"
            fi
            exit 1
          fi
          id=$(jq -r .id "$RUNNER_TEMP/upload.json")
          echo "SARIF upload $id accepted for $REF at $SHA" | tee -a "$GITHUB_STEP_SUMMARY"
          # Processing usually takes under a minute; a SARIF file code scanning rejects fails here, not silently.
          for _ in $(seq 24); do
            st=$(gh api "repos/$SOURCE/code-scanning/sarifs/$id" --jq .processing_status) || st=unknown
            case "$st" in
              complete) echo "processed"; exit 0 ;;
              failed) gh api "repos/$SOURCE/code-scanning/sarifs/$id" --jq '.errors[]?'; echo "::error::code scanning could not process upload $id"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::warning::upload $id is still $st after 2 minutes; see oneTake's Security > Code scanning"
      - name: No token, no status
        if: steps.token.outcome != 'success'
        run: echo "::warning::no oneTake-Runners1 App token for marshiyar/oneTake (is the App installed on that repository?); the Swift analysis ran here, but status was not set"
      - name: Status result
        if: always() && steps.token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ needs.start.outputs.head }}
          ANALYZE: ${{ needs.analyze.result }}
          UPLOAD: ${{ steps.upload.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$ANALYZE" = success ] && [ "$UPLOAD" = success ]; then
            state=success desc="Swift analysed, results in code scanning"
          elif [ "$ANALYZE" = cancelled ]; then
            state=error desc="Swift analysis was cancelled"
          elif [ "$ANALYZE" != success ]; then
            state=failure desc="Swift analysis ended $ANALYZE"
          else
            state=failure desc="SARIF upload failed"
          fi
          gh api -X POST "repos/$SOURCE/statuses/$SHA" -f state="$state" -f context="$CONTEXT" \
            -f description="$desc" -f target_url="$RUN" > /dev/null
